<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Sabnira Afrin - Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1740"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#FACC15" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FACC15" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="18" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="997" height="297" rx="17" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.75"/>

  <!-- floating code symbols -->
  <g font-family="Consolas, 'Courier New', monospace" font-weight="700" fill="#FACC15" opacity="0.22">
    <text x="610" y="70" font-size="34">{ }</text>
    <text x="900" y="85" font-size="28">;</text>
    <text x="930" y="250" font-size="40">( )</text>
    <text x="560" y="255" font-size="30">=&gt;</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- rotating ring + emblem -->
  <g transform="translate(790 150)">
    <circle r="82" fill="none" stroke="#FACC15" stroke-width="2" stroke-dasharray="6 10" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="58" fill="none" stroke="#FDE047" stroke-width="1.5" opacity="0.5"/>
    <circle r="5" cx="82" cy="0" fill="#FACC15">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <text text-anchor="middle" y="15" font-family="Consolas, 'Courier New', monospace" font-size="46" font-weight="800" fill="url(#gold)">&lt;/&gt;</text>
  </g>

  <!-- name -->
  <text x="60" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#FFFFFF">Sabnira Afrin</text>
  <rect x="60" y="146" width="0" height="6" rx="3" fill="url(#gold)">
    <animate attributeName="width" from="0" to="300" dur="1.2s" fill="freeze"/>
  </rect>

  <!-- role -->
  <text x="60" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#FACC15">Full Stack Developer · Frontend-Focused · MERN</text>

  <!-- rotating tagline -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#CBD5E1">
    <text x="60" y="240" opacity="1">&gt; I build responsive, user-focused web apps
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.30;0.34;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="240" opacity="0">&gt; Clean code · Smooth UX · Scalable frontends
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.37;0.63;0.67;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="240" opacity="0">&gt; React · Node.js · Express · MongoDB
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.70;0.97;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
